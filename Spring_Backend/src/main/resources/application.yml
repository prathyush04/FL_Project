spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:fl_backend;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: averylongsecretkeywhichisatleast256bitlongforhmacsha256algorithm1234567890
  expiration: 86400000 # 24 hours
